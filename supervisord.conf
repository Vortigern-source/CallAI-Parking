[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
loglevel=debug

[program:ai-service]
command=python server.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/ai-service.err.log
stdout_logfile=/var/log/supervisor/ai-service.out.log
environment=PORT="8765",FAST_API_PORT="8765"
redirect_stderr=true

[program:init-db]
command=python -u init_db.py
directory=/app/web-ui/backend
autostart=true
autorestart=false
startsecs=0
stopwaitsecs=1
stderr_logfile=/var/log/supervisor/init-db.err.log
stdout_logfile=/var/log/supervisor/init-db.out.log
environment=DATABASE_URL="sqlite:///data/parking.db",PYTHONPATH="/app/web-ui/backend:/app"
redirect_stderr=true

[program:web-ui-backend]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8000 --log-level debug
directory=/app/web-ui/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/web-ui.err.log
stdout_logfile=/var/log/supervisor/web-ui.out.log
environment=DATABASE_URL="sqlite:///data/parking.db",PYTHONPATH="/app/web-ui/backend:/app",NODE_ENV="production"
redirect_stderr=true
priority=999
depends_on=init-db

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log