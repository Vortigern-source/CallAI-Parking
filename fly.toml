# fly.toml app configuration file for CallAI Parking Platform

app = 'callgpt-parking'
primary_region = 'iad'

[experimental]
  auto_rollback = true

[build]
  dockerfile = "Dockerfile"

[env]
  FLY_APP_NAME = 'callgpt-parking'
  ENVIRONMENT = 'production'
  DATABASE_URL = 'postgresql://postgres:callaiparking@callgpt-parking-db.internal:5432/callaiparking'
  PORT = '8765'
  FAST_API_PORT = '8765'
  # Note: Set INITIAL_ADMIN_PASSWORD and SECRET_KEY via Fly.io secrets

[http_service]
  internal_port = 8765  # Changed from 8000 to 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8765  # Primary service on 8765
  
  [[services.ports]]
    port = 80
    handlers = ['http']
    
  [[services.ports]]
    port = 443
    handlers = ['http', 'tls']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '30s'

# Keep the secondary service for web UI backend
[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 8000
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '30s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[metrics]]
  port = 9090
  path = '/metrics'
