app = "callgpt-parking"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FLY_APP_NAME = "callgpt-parking"
  ENVIRONMENT = "production"
  DATABASE_URL = "postgresql://postgres:callaiparking@callgpt-parking-db.internal:5432/callaiparking"
  PORT = "8765"
  FAST_API_PORT = "8765"

[experimental]
  auto_rollback = true
  
  [experimental.attached]
    secrets = {}

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    
  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

[[services]]
  protocol = "tcp"
  internal_port = 8765

  [[services.ports]]
    port = 8765
    handlers = ["tcp"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"

[[metrics]]
  port = 9090
  path = "/metrics"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
