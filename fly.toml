app = "callai-parking"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  FLY_APP_NAME = "callai-parking"
  ENVIRONMENT = "production"
  DATABASE_URL = "postgresql://postgres:callaiparking@callgpt-parking-db.internal:5432/callaiparking"
  PORT = "8765"
  FAST_API_PORT = "8765"

[experimental]
  auto_rollback = true
  
  [experimental.attached]
    postgres = [
      { name = "callgpt-parking-db" }
    ]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    
  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[services]]
  protocol = "tcp"
  internal_port = 8765

  [[services.ports]]
    port = 8765
    handlers = ["tcp"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[metrics]]
  port = 9090
  path = "/metrics"
