version: '3.8'

services:
  web-ui-backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:callaiparking@db:5432/callaiparking
      - SECRET_KEY=3babffad7c7bf70292c6e14c30c1f713f8c41acab62f745d9244ea680b8d6954
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,https://callgpt-parking.fly.dev
    depends_on:
      - db
    volumes:
      - ./web-ui/backend:/app/web-ui/backend
      - ./web-ui/build:/app/web-ui/backend/static

  ai-service:
    build: 
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8765:8765"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FLY_APP_NAME=callgpt-parking
    volumes:
      - ./server.py:/app/server.py
      - ./bot.py:/app/bot.py
      - ./custom_pipecat:/app/custom_pipecat

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=callaiparking
      - POSTGRES_PASSWORD=callaiparking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build: 
      context: ./web-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
      - REACT_APP_AI_SERVICE_URL=http://localhost:8765
    depends_on:
      - web-ui-backend
      - ai-service

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
